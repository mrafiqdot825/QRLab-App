steps:
  - launch: com.rafiqdev.qrstudio
  - await:
      visible:
        text: QRLab
  - tap:
      text: Website Link
  - await:
      visible:
        text: Studio workspace
  - tool: gesture-swipe
    args:
      fromX: 0.5
      fromY: 0.75
      toX: 0.5
      toY: 0.35
      durationMs: 600
  - await:
      idle: true
