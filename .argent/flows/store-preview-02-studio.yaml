executionPrerequisite: >-
  App is in Studio on the Studio workspace screen.
steps:
  - await:
      visible:
        text: Studio workspace
  - wait: 1500
  - tool: gesture-swipe
    args:
      fromX: 0.5
      fromY: 0.75
      toX: 0.5
      toY: 0.35
      durationMs: 700
  - wait: 2500
  - tap:
      text: Search
  - await:
      visible:
        text: Explore practices
  - wait: 2000
